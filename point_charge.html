<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>点电荷电场仿真 </title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            overflow: hidden;
        }
        #container {
            display: flex;
            height: 100vh;
        }
        #canvas {
            background-color: #000;
            cursor: crosshair;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        #coordinate-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 3px;
            pointer-events: none;
        }
        #controls {
            width: 280px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
        }
        .control-group {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            height: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #4b6cb7;
            cursor: pointer;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin: 5px 0 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
            box-sizing: border-box;
        }
        .coordinate-inputs {
            display: flex;
            gap: 10px;
        }
        .coordinate-inputs input {
            width: 50%;
        }
        .value-display {
            text-align: center;
            font-size: 12px;
            color: #aaa;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: linear-gradient(to right, #4b6cb7, #182848);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        #info {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            font-size: 12px;
        }
        .legend {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 12px;
        }
        .legend-color {
            width: 20px;
            height: 10px;
            margin-right: 8px;
            border-radius: 2px;
        }
        h3 {
            margin-top: 0;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }
        h4 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 15px;
            color: #eee;
        }
        .particle-controls {
            margin-top: 15px;
        }
        .selected-particle {
            padding: 10px;
            background: rgba(75, 108, 183, 0.3);
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div style="position: relative;">
            <canvas id="canvas" width="900" height="700"></canvas>
            <div id="coordinate-info">坐标: (0, 0)</div>
        </div>
        <div id="controls">
            <h3>点电荷电场仿真 by zhucr</h3>
            
            <div class="control-group">
                <h4>粒子管理</h4>
                <button onclick="addParticle()">添加粒子</button>
                <button onclick="removeSelectedParticle()">删除选中粒子</button>
                
                <label>通过编号选中粒子:</label>
                <input type="text" id="selectByIdInput" placeholder="输入粒子编号">
                <button onclick="selectParticleById()">确认选中</button>
                
                <div class="selected-particle" id="selectedParticleInfo">
                    未选中粒子
                </div>
                
                <div class="particle-controls" id="particleControls" style="display: none;">
                    <label>电荷量 (q):</label>
                    <input type="range" id="particleChargeSlider" min="-10" max="10" step="0.5" value="1">
                    <div class="value-display" id="particleChargeValue">1.0</div>
                    
                    <input type="text" id="particleChargeInput" placeholder="输入电荷量值">
                    <button onclick="updateParticleChargeFromInput()">应用电荷量</button>
                    
                    <label>坐标位置 (以中心为原点):</label>
                    <div class="coordinate-inputs">
                        <div>
                            <label>X:</label>
                            <input type="text" id="particleXInput" placeholder="X坐标">
                        </div>
                        <div>
                            <label>Y:</label>
                            <input type="text" id="particleYInput" placeholder="Y坐标">
                        </div>
                    </div>
                    <button onclick="updateParticlePositionFromInput()">应用坐标</button>
                    
                    <label>X 位置调节:</label>
                    <input type="range" id="particleXSlider" min="-430" max="430" step="1" value="0">
                    <div class="value-display" id="particleXValue">0</div>
                    
                    <label>Y 位置调节:</label>
                    <input type="range" id="particleYSlider" min="-330" max="330" step="1" value="0">
                    <div class="value-display" id="particleYValue">0</div>
                </div>
            </div>
            
            <div class="control-group">
                <button onclick="resetSimulation()">重置仿真</button>
                <button onclick="toggleAnimation()">暂停/继续</button>
            </div>
            
            <div class="legend">
                <strong>图例:</strong>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff4444;"></div>
                    <span>正电荷 (+q)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #4444ff;"></div>
                    <span>负电荷 (-q)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: linear-gradient(to right, #000033, #0000ff, #00ff00, #ffff00, #ff0000);"></div>
                    <span>电势高低</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ffff00;"></div>
                    <span>选中粒子</span>
                </div>
            </div>
            
            <div id="info">
                <strong>当前位置电势:</strong>
                <div id="potentialValue">0.00 V</div>
                <strong>电场强度:</strong>
                <div id="fieldValue">0.00</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;  // 画布中心X坐标
        const centerY = height / 2; // 画布中心Y坐标
        
        // 控件元素
        const particleChargeSlider = document.getElementById('particleChargeSlider');
        const particleChargeInput = document.getElementById('particleChargeInput');
        const particleXSlider = document.getElementById('particleXSlider');
        const particleYSlider = document.getElementById('particleYSlider');
        const particleXInput = document.getElementById('particleXInput');
        const particleYInput = document.getElementById('particleYInput');
        const selectedParticleInfo = document.getElementById('selectedParticleInfo');
        const particleControls = document.getElementById('particleControls');
        const selectByIdInput = document.getElementById('selectByIdInput');
        const coordinateInfo = document.getElementById('coordinate-info');
        
        // 粒子数组（初始2个粒子）
        let particles = [
            { id: 1, x: -125, y: 0, q: 1 },   // 使用中心为原点的坐标
            { id: 2, x: 125, y: 0, q: -1 }    // 使用中心为原点的坐标
        ];
        const particleRadius = 15; // 固定粒子半径，与电荷量无关
        let selectedParticleId = null; // 当前选中的粒子ID
        let nextParticleId = 3; // 下一个新粒子的ID
        let isDragging = false; // 是否处于拖动状态
        let dragOffsetX = 0; // 拖动时鼠标与粒子中心的X偏移
        let dragOffsetY = 0; // 拖动时鼠标与粒子中心的Y偏移
        
        const k = 8000; // 库仑常数（缩放）
        const baseFieldLines = 8; // 单位电荷量对应的电场线数量
        let animationId;
        let isAnimating = true;
        let needsRedraw = true;
        
        // -------------------------- 坐标转换工具函数 --------------------------
        // 从画布坐标（像素）转换到以中心为原点的坐标
        function canvasToOriginCoords(canvasX, canvasY) {
            return {
                x: canvasX - centerX,
                y: centerY - canvasY  // Y轴向上为正
            };
        }
        
        // 从以中心为原点的坐标转换到画布坐标（像素）
        function originToCanvasCoords(originX, originY) {
            return {
                x: originX + centerX,
                y: centerY - originY  // Y轴向上为正
            };
        }
        
        // 获取当前选中的粒子
        function getSelectedParticle() {
            return particles.find(p => p.id === selectedParticleId);
        }
        
        // 通过编号选中粒子
        function selectParticleById() {
            const input = selectByIdInput.value.trim();
            if (!input) {
                alert('请输入粒子编号');
                return;
            }
            
            const id = parseInt(input, 10);
            if (isNaN(id)) {
                alert('请输入有效的数字编号');
                return;
            }
            
            const particleExists = particles.some(p => p.id === id);
            if (particleExists) {
                selectParticle(id);
                selectByIdInput.value = ''; // 清空输入框
            } else {
                alert(`不存在编号为 ${id} 的粒子`);
            }
        }
        
        // 支持回车键选中粒子
        selectByIdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                selectParticleById();
            }
        });
        
        // 从输入框更新粒子位置
        function updateParticlePositionFromInput() {
            const particle = getSelectedParticle();
            if (!particle) return;
            
            const x = parseFloat(particleXInput.value);
            const y = parseFloat(particleYInput.value);
            
            if (isNaN(x) || isNaN(y)) {
                alert('请输入有效的数字坐标');
                return;
            }
            
            // 限制坐标范围，防止粒子超出画布
            const maxX = width/2 - particleRadius;
            const maxY = height/2 - particleRadius;
            
            particle.x = Math.max(-maxX, Math.min(maxX, x));
            particle.y = Math.max(-maxY, Math.min(maxY, y));
            
            updateParticleControls();
            needsRedraw = true;
        }
        
        // 从输入框更新粒子电荷量
        function updateParticleChargeFromInput() {
            const particle = getSelectedParticle();
            if (!particle) return;
            
            const charge = parseFloat(particleChargeInput.value);
            
            if (isNaN(charge) || charge < -10 || charge > 10) {
                alert('请输入-10到10之间的有效数字');
                // 恢复输入框的值为当前电荷量
                particleChargeInput.value = particle.q;
                return;
            }
            
            // 更新粒子电荷量
            particle.q = charge;
            
            // 同步更新滑块和显示值
            particleChargeSlider.value = charge;
            document.getElementById('particleChargeValue').textContent = charge.toFixed(1);
            selectedParticleInfo.textContent = `选中粒子 #${particle.id} (q = ${particle.q.toFixed(1)})`;
            
            needsRedraw = true;
        }
        
        // 支持坐标输入框回车键确认
        particleXInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                updateParticlePositionFromInput();
            }
        });
        
        particleYInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                updateParticlePositionFromInput();
            }
        });
        
        // 支持电荷量输入框回车键确认
        particleChargeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                updateParticleChargeFromInput();
            }
        });
        
        // -------------------------- 物理计算函数 --------------------------
        // 计算指定点的电势（不考虑粒子半径内的区域）
        function calculatePotential(originX, originY) {
            let potential = 0;
            for (const particle of particles) {
                // 计算两点之间的距离
                const dx = originX - particle.x;
                const dy = originY - particle.y;
                const r = Math.sqrt(dx * dx + dy * dy);
                
                // 如果在粒子半径内，不计算该粒子的电势贡献
                if (r < particleRadius) continue;
                
                potential += k * particle.q / r;
            }
            return potential;
        }
        
        // 计算指定点的电场强度（不考虑粒子半径内的区域）
        function calculateField(originX, originY) {
            let Ex = 0, Ey = 0;
            for (const particle of particles) {
                // 计算两点之间的距离
                const dx = originX - particle.x;
                const dy = originY - particle.y;
                const r = Math.sqrt(dx * dx + dy * dy);
                
                // 如果在粒子半径内，不计算该粒子的电场贡献
                if (r < particleRadius) continue;
                
                Ex += k * particle.q * dx / (r ** 3);
                Ey += k * particle.q * dy / (r ** 3);
            }
            return { Ex, Ey, E: Math.sqrt(Ex **2 + Ey** 2) };
        }
        
        // -------------------------- 绘图函数 --------------------------
        // 绘制坐标网格（辅助线）
        function drawCoordinateGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            
            // 绘制X轴（水平线）
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(width, centerY);
            ctx.stroke();
            
            // 绘制Y轴（垂直线）
            ctx.beginPath();
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, height);
            ctx.stroke();
            
            // 绘制刻度线
            const gridSize = 50; // 网格间距
            
            // X轴刻度
            for (let x = -Math.floor(centerX / gridSize) * gridSize; x <= Math.floor(centerX / gridSize) * gridSize; x += gridSize) {
                if (x === 0) continue; // 原点已由轴线标示
                const canvasX = originToCanvasCoords(x, 0).x;
                
                ctx.beginPath();
                ctx.moveTo(canvasX, centerY - 5);
                ctx.lineTo(canvasX, centerY + 5);
                ctx.stroke();
                
                // 绘制坐标值
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(x, canvasX, centerY + 8);
            }
            
            // Y轴刻度
            for (let y = -Math.floor(centerY / gridSize) * gridSize; y <= Math.floor(centerY / gridSize) * gridSize; y += gridSize) {
                if (y === 0) continue; // 原点已由轴线标示
                const canvasY = originToCanvasCoords(0, y).y;
                
                ctx.beginPath();
                ctx.moveTo(centerX - 5, canvasY);
                ctx.lineTo(centerX + 5, canvasY);
                ctx.stroke();
                
                // 绘制坐标值
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.font = '10px Arial';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(y, centerX + 8, canvasY);
            }
            
            // 绘制原点标记
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '12px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText('(0,0)', centerX + 5, centerY - 5);
        }
        
        // 绘制电势热图
        function drawPotentialHeatmap() {
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;
            
            // 先计算全局电势范围（用于归一化颜色）
            let maxPotential = -Infinity;
            let minPotential = Infinity;
            for (let canvasX = 0; canvasX < width; canvasX += 5) {
                for (let canvasY = 0; canvasY < height; canvasY += 5) {
                    const originCoords = canvasToOriginCoords(canvasX, canvasY);
                    const V = calculatePotential(originCoords.x, originCoords.y);
                    if (!isNaN(V)) { // 跳过粒子内部
                        maxPotential = Math.max(maxPotential, V);
                        minPotential = Math.min(minPotential, V);
                    }
                }
            }
            
            // 处理所有粒子都是同号电荷的情况
            if (maxPotential === minPotential) {
                maxPotential = minPotential + 1;
            }
            
            // 逐像素绘制热图
            for (let canvasX = 0; canvasX < width; canvasX++) {
                for (let canvasY = 0; canvasY < height; canvasY++) {
                    const originCoords = canvasToOriginCoords(canvasX, canvasY);
                    const V = calculatePotential(originCoords.x, originCoords.y);
                    
                    // 粒子内部不绘制热图（保持黑色）
                    let isInsideParticle = false;
                    for (const particle of particles) {
                        const dx = originCoords.x - particle.x;
                        const dy = originCoords.y - particle.y;
                        const r = Math.sqrt(dx * dx + dy * dy);
                        if (r < particleRadius) {
                            isInsideParticle = true;
                            break;
                        }
                    }
                    
                    if (isInsideParticle) {
                        continue; // 粒子内部保持黑色
                    }
                    
                    // 归一化到0-1范围（防止颜色溢出）
                    let normalized = (V - minPotential) / (maxPotential - minPotential);
                    normalized = Math.max(0, Math.min(1, normalized));
                    
                    const color = getHeatmapColor(normalized);
                    const index = (canvasY * width + canvasX) * 4;
                    data[index] = color.r;     // 红通道
                    data[index + 1] = color.g; // 绿通道
                    data[index + 2] = color.b; // 蓝通道
                    data[index + 3] = 80;      // 透明度（80/255）
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }
        
        // 热图颜色映射（蓝→绿→黄→红）
        function getHeatmapColor(value) {
            if (value < 0.2) return { r: 0, g: 0, b: Math.floor(255 * value / 0.2) };
            if (value < 0.4) return { r: 0, g: Math.floor(255 * (value - 0.2) / 0.2), b: 255 };
            if (value < 0.6) return { r: 0, g: 255, b: Math.floor(255 * (1 - (value - 0.4) / 0.2)) };
            if (value < 0.8) return { r: Math.floor(255 * (value - 0.6) / 0.2), g: 255, b: 0 };
            return { r: 255, g: Math.floor(255 * (1 - (value - 0.8) / 0.2)), b: 0 };
        }
        
        // 绘制等势线
        function drawEquipotentialLines() {
            const numLevels = 18; // 等势线数量（避免过于密集）
            const levels = [];
            
            // 计算电势范围
            let maxPotential = -Infinity;
            let minPotential = Infinity;
            for (let canvasX = 0; canvasX < width; canvasX += 10) {
                for (let canvasY = 0; canvasY < height; canvasY += 10) {
                    const originCoords = canvasToOriginCoords(canvasX, canvasY);
                    const V = calculatePotential(originCoords.x, originCoords.y);
                    if (!isNaN(V)) { // 跳过粒子内部
                        maxPotential = Math.max(maxPotential, V);
                        minPotential = Math.min(minPotential, V);
                    }
                }
            }
            
            // 处理所有粒子都是同号电荷的情况
            if (maxPotential === minPotential) {
                maxPotential = minPotential + 1;
            }
            
            // 生成等势线电平
            for (let i = 0; i < numLevels; i++) {
                levels.push(minPotential + (maxPotential - minPotential) * i / (numLevels - 1));
            }
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]); // 虚线样式
            
            // 绘制每条等势线
            levels.forEach(level => {
                for (let canvasX = 0; canvasX < width - 4; canvasX += 4) {
                    for (let canvasY = 0; canvasY < height - 4; canvasY += 4) {
                        // 检查是否在粒子内部
                        const originCoords = canvasToOriginCoords(canvasX, canvasY);
                        let isInsideParticle = false;
                        for (const particle of particles) {
                            const dx = originCoords.x - particle.x;
                            const dy = originCoords.y - particle.y;
                            const r = Math.sqrt(dx * dx + dy * dy);
                            if (r < particleRadius) {
                                isInsideParticle = true;
                                break;
                            }
                        }
                        if (isInsideParticle) continue;
                        
                        const V1 = calculatePotential(originCoords.x, originCoords.y);
                        const V2 = calculatePotential(originCoords.x + 4, originCoords.y);
                        const V3 = calculatePotential(originCoords.x, originCoords.y + 4);
                        
                        // 检测水平方向电势交叉（绘制竖直线段）
                        if ((V1 <= level && V2 >= level) || (V1 >= level && V2 <= level)) {
                            ctx.beginPath();
                            ctx.moveTo(canvasX + 2, canvasY);
                            ctx.lineTo(canvasX + 2, canvasY + 4);
                            ctx.stroke();
                        }
                        // 检测垂直方向电势交叉（绘制水平线段）
                        if ((V1 <= level && V3 >= level) || (V1 >= level && V3 <= level)) {
                            ctx.beginPath();
                            ctx.moveTo(canvasX, canvasY + 2);
                            ctx.lineTo(canvasX + 4, canvasY + 2);
                            ctx.stroke();
                        }
                    }
                }
            });
            
            ctx.setLineDash([]); // 恢复实线
        }
        
        // 绘制电场线（电场线数量与电荷量成正比）
        function drawFieldLines() {
            particles.forEach(particle => {
                // 计算电场线数量：与电荷量绝对值成正比，至少1条
                const chargeAbs = Math.abs(particle.q);
                const numLines = Math.max(1, Math.round(chargeAbs * baseFieldLines));
                
                for (let i = 0; i < numLines; i++) {
                    const angle = (i / numLines) * Math.PI * 2;
                    // 从粒子边缘开始绘制（避免与粒子重叠）
                    const startX = particle.x + Math.cos(angle) * particleRadius;
                    const startY = particle.y + Math.sin(angle) * particleRadius;
                    
                    // 电场线方向：正电荷向外（1），负电荷向内（-1）
                    drawSingleFieldLine(startX, startY, particle.q);
                }
            });
        }
        
        // 绘制单条电场线（带箭头）
        function drawSingleFieldLine(startX, startY, charge) {
            let x = startX;
            let y = startY;
            const points = [{ x, y }];
            const maxSteps = 300; // 最大步数（防止无限循环）
            const stepSize = 2;   // 每步长度
            let endReason = null; // 记录电场线终止原因：'boundary' 或 'particle'
            let endParticle = null; // 记录终止时碰撞的粒子
            
            // 迭代计算电场线路径
            for (let step = 0; step < maxSteps; step++) {
                const field = calculateField(x, y);
                if (field.E < 0.1) break; // 电场过弱，停止绘制
                
                // 计算下一步位置（单位向量*步长）
                // 正电荷：沿电场方向移动（向外）
                // 负电荷：逆电场方向移动（向内）
                const direction = charge > 0 ? 1 : -1;
                const dx = direction * (field.Ex / field.E) * stepSize;
                const dy = direction * (field.Ey / field.E) * stepSize;
                x += dx;
                y += dy;
                
                // 转换为画布坐标进行边界检测
                const canvasCoords = originToCanvasCoords(x, y);
                if (canvasCoords.x < 0 || canvasCoords.x > width || 
                    canvasCoords.y < 0 || canvasCoords.y > height) {
                    endReason = 'boundary';
                    break;
                }
                
                // 碰撞检测：接近任何粒子则停止
                let isTooClose = false;
                for (const particle of particles) {
                    const dxParticle = x - particle.x;
                    const dyParticle = y - particle.y;
                    const dist = Math.sqrt(dxParticle * dxParticle + dyParticle * dyParticle);
                    if (dist < particleRadius) {
                        isTooClose = true;
                        endReason = 'particle';
                        endParticle = particle;
                        break;
                    }
                }
                if (isTooClose) break;
                
                points.push({ x, y });
            }
            
            // 绘制判断逻辑
            let shouldDraw = true;
            
            // 对于负电荷发出的电场线，检查是否终止于正电荷，如果是则不绘制
            if (charge < 0 && endReason === 'particle' && endParticle && endParticle.q > 0) {
                shouldDraw = false; // 负电荷到正电荷的电场线不绘制
            }
            
            // 绘制电场线（至少5个点才绘制，避免短线段）
            if (shouldDraw && points.length > 5) {
                ctx.strokeStyle = 'rgba(255, 255, 100, 0.7)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                
                // 转换第一个点为画布坐标
                const firstPoint = originToCanvasCoords(points[0].x, points[0].y);
                ctx.moveTo(firstPoint.x, firstPoint.y);
                
                // 绘制所有点
                for (let i = 1; i < points.length; i++) {
                    const canvasPoint = originToCanvasCoords(points[i].x, points[i].y);
                    ctx.lineTo(canvasPoint.x, canvasPoint.y);
                }
                ctx.stroke();
                
                // 绘制箭头（箭头方向始终指向电场方向）
                if (points.length > 20) {
                    const arrowIndex = Math.floor(points.length * 0.7);
                    const p1 = points[arrowIndex];
                    const p2 = points[arrowIndex + 5];
                    const canvasP1 = originToCanvasCoords(p1.x, p1.y);
                    const canvasP2 = originToCanvasCoords(p2.x, p2.y);

                    // 负电荷：箭头朝内（指向粒子）
                    if (charge < 0) {
                        drawArrow(canvasP2.x, canvasP2.y, canvasP1.x, canvasP1.y);
                    } else {
                        drawArrow(canvasP1.x, canvasP1.y, canvasP2.x, canvasP2.y);
                    }
                }
            }
        }
        
        // 绘制箭头
        function drawArrow(fromX, fromY, toX, toY) {
            const angle = Math.atan2(toY - fromY, toX - fromX);
            const arrowLength = 8;  // 箭头长度
            const arrowAngle = Math.PI / 6; // 箭头张开角度（30°）
            
            ctx.strokeStyle = 'rgba(255, 255, 100, 0.9)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            // 箭头左半部分
            ctx.moveTo(toX, toY);
            ctx.lineTo(
                toX - arrowLength * Math.cos(angle - arrowAngle),
                toY - arrowLength * Math.sin(angle - arrowAngle)
            );
            // 箭头右半部分
            ctx.moveTo(toX, toY);
            ctx.lineTo(
                toX - arrowLength * Math.cos(angle + arrowAngle),
                toY - arrowLength * Math.sin(angle + arrowAngle)
            );
            ctx.stroke();
        }
        
        // 绘制所有粒子（显示编号，半径固定）
        function drawParticles() {
            particles.forEach(particle => {
                // 转换为画布坐标
                const canvasCoords = originToCanvasCoords(particle.x, particle.y);
                
                // 粒子颜色：正电荷红色，负电荷蓝色
                ctx.fillStyle = particle.q > 0 ? '#ff4444' : '#4444ff';
                
                // 绘制粒子主体（固定半径）
                ctx.beginPath();
                ctx.arc(canvasCoords.x, canvasCoords.y, particleRadius, 0, Math.PI * 2);
                ctx.fill();
                
                // 选中粒子的高亮边框（黄色2px）
                if (particle.id === selectedParticleId) {
                    ctx.strokeStyle = '#ffff00';
                    ctx.lineWidth = 2;
                } else {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                }
                ctx.stroke();
                
                // 绘制粒子编号（居中显示）
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${Math.floor(particleRadius * 0.8)}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(particle.id, canvasCoords.x, canvasCoords.y);
                
                // 绘制电荷量数值（编号下方）
                ctx.font = `bold ${Math.floor(particleRadius * 0.5)}px Arial`;
                ctx.fillText(particle.q.toFixed(1), canvasCoords.x, canvasCoords.y + particleRadius * 0.6);
            });
        }
        
        // -------------------------- 粒子管理函数 --------------------------
        // 添加新粒子（默认在原点，电荷量1）
        function addParticle() {
            const newParticle = {
                id: nextParticleId++,
                x: 0,
                y: 0,
                q: 1 // 默认正电荷
            };
            particles.push(newParticle);
            selectParticle(newParticle.id); // 自动选中新粒子
            needsRedraw = true;
        }
        
        // 删除选中粒子（至少保留1个粒子）
        function removeSelectedParticle() {
            if (selectedParticleId === null || particles.length <= 1) {
                alert(particles.length <= 1 ? '至少保留1个粒子！' : '请先选中粒子！');
                return;
            }
            // 过滤掉选中的粒子
            particles = particles.filter(p => p.id !== selectedParticleId);
            // 自动选中第一个粒子
            selectedParticleId = particles[0].id;
            updateParticleControls(); // 更新控件显示
            needsRedraw = true;
        }
        
        // 选中指定ID的粒子
        function selectParticle(particleId) {
            selectedParticleId = particleId;
            updateParticleControls(); // 同步更新右侧控件
            needsRedraw = true; // 重绘以显示选中状态
        }
        
        // 更新粒子控制控件（右侧滑块与显示值）
        function updateParticleControls() {
            const particle = getSelectedParticle();
            if (!particle) {
                // 无选中粒子
                selectedParticleInfo.textContent = '未选中粒子';
                particleControls.style.display = 'none';
                return;
            }
            
            // 有选中粒子：更新显示与滑块
            selectedParticleInfo.textContent = `选中粒子 #${particle.id} (q = ${particle.q.toFixed(1)})`;
            particleControls.style.display = 'block';
            
            // 同步滑块值（关闭事件监听避免循环触发）
            particleChargeSlider.removeEventListener('input', updateSimulation);
            particleXSlider.removeEventListener('input', updateSimulation);
            particleYSlider.removeEventListener('input', updateSimulation);
            
            particleChargeSlider.value = particle.q;
            particleXSlider.value = particle.x;
            particleYSlider.value = particle.y;
            
            // 更新坐标输入框
            particleXInput.value = particle.x;
            particleYInput.value = particle.y;
            
            // 更新电荷量输入框
            particleChargeInput.value = particle.q;
            
            // 恢复事件监听
            particleChargeSlider.addEventListener('input', updateSimulation);
            particleXSlider.addEventListener('input', updateSimulation);
            particleYSlider.addEventListener('input', updateSimulation);
            
            // 更新数值显示
            document.getElementById('particleChargeValue').textContent = particle.q.toFixed(1);
            document.getElementById('particleXValue').textContent = particle.x;
            document.getElementById('particleYValue').textContent = particle.y;
        }
        
        // 更新粒子属性（由滑块触发）
        function updateSimulation() {
            const particle = getSelectedParticle();
            if (!particle) return;
            
            // 更新粒子属性
            particle.q = parseFloat(particleChargeSlider.value);
            particle.x = parseFloat(particleXSlider.value);
            particle.y = parseFloat(particleYSlider.value);
            
            // 限制坐标范围，防止粒子超出画布
            const maxX = width/2 - particleRadius;
            const maxY = height/2 - particleRadius;
            particle.x = Math.max(-maxX, Math.min(maxX, particle.x));
            particle.y = Math.max(-maxY, Math.min(maxY, particle.y));
            
            // 同步更新输入框
            particleXInput.value = particle.x;
            particleYInput.value = particle.y;
            particleChargeInput.value = particle.q;
            
            // 同步更新显示
            document.getElementById('particleChargeValue').textContent = particle.q.toFixed(1);
            document.getElementById('particleXValue').textContent = particle.x;
            document.getElementById('particleYValue').textContent = particle.y;
            selectedParticleInfo.textContent = `选中粒子 #${particle.id} (q = ${particle.q.toFixed(1)})`;
            
            needsRedraw = true;
        }
        
        // -------------------------- 动画与事件函数 --------------------------
        // 渲染主函数
        function render() {
            if (needsRedraw) {
                // 清空画布
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, width, height);
                
                // 按层次绘制（从下到上）
                drawCoordinateGrid();      // 1. 坐标网格（最下层）
                drawPotentialHeatmap();    // 2. 电势热图
                drawEquipotentialLines();  // 3. 等势线
                drawFieldLines();          // 4. 电场线
                drawParticles();           // 5. 粒子（最上层）
                
                needsRedraw = false;
            }
            
            if (isAnimating) {
                animationId = requestAnimationFrame(render);
            }
        }
        
        // 重置仿真（恢复初始2个粒子）
        function resetSimulation() {
            particles = [
                { id: 1, x: -125, y: 0, q: 1 },
                { id: 2, x: 125, y: 0, q: -1 }
            ];
            nextParticleId = 3;
            selectParticle(1); // 选中第一个粒子
            needsRedraw = true;
        }
        
        // 暂停/继续动画
        function toggleAnimation() {
            isAnimating = !isAnimating;
            if (isAnimating) {
                render(); // 继续动画
            } else {
                cancelAnimationFrame(animationId); // 暂停动画
            }
        }
        
        // -------------------------- 事件监听初始化 --------------------------
        // 滑块事件（更新粒子属性）
        particleChargeSlider.addEventListener('input', updateSimulation);
        particleXSlider.addEventListener('input', updateSimulation);
        particleYSlider.addEventListener('input', updateSimulation);
        
        // 画布鼠标事件（粒子选择与拖动）
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            // 计算鼠标在画布内的坐标（像素）
            const canvasX = e.clientX - rect.left;
            const canvasY = e.clientY - rect.top;
            // 转换为原点坐标
            const originCoords = canvasToOriginCoords(canvasX, canvasY);
            
            // 遍历所有粒子，检测是否点击到粒子
            for (const particle of particles) {
                const dx = originCoords.x - particle.x;
                const dy = originCoords.y - particle.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist <= particleRadius) {
                    // 点击到粒子：选中并记录拖动偏移
                    selectParticle(particle.id);
                    isDragging = true;
                    // 计算偏移（原点坐标）
                    dragOffsetX = originCoords.x - particle.x;
                    dragOffsetY = originCoords.y - particle.y;
                    canvas.style.cursor = 'grabbing'; // 鼠标样式改为"抓取"
                    needsRedraw = true;
                    return;
                }
            }
            
            // 未点击到任何粒子：取消选中
            selectedParticleId = null;
            updateParticleControls();
            canvas.style.cursor = 'crosshair'; // 恢复鼠标样式
            needsRedraw = true;
        });
        
        // 鼠标移动（拖动粒子+更新电势/场强显示+坐标提示）
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const canvasX = e.clientX - rect.left;
            const canvasY = e.clientY - rect.top;
            const originCoords = canvasToOriginCoords(canvasX, canvasY);
            
            // 更新坐标提示
            coordinateInfo.textContent = `坐标: (${Math.round(originCoords.x)}, ${Math.round(originCoords.y)})`;
            
            // 1. 更新鼠标位置的电势和场强信息（仅在粒子外部）
            let isInsideParticle = false;
            for (const particle of particles) {
                const dx = originCoords.x - particle.x;
                const dy = originCoords.y - particle.y;
                const r = Math.sqrt(dx * dx + dy * dy);
                if (r < particleRadius) {
                    isInsideParticle = true;
                    break;
                }
            }
            
            if (isInsideParticle) {
                document.getElementById('potentialValue').textContent = '粒子内部';
                document.getElementById('fieldValue').textContent = '粒子内部';
            } else {
                const V = calculatePotential(originCoords.x, originCoords.y);
                const field = calculateField(originCoords.x, originCoords.y);
                document.getElementById('potentialValue').textContent = V.toFixed(2) + ' V';
                document.getElementById('fieldValue').textContent = field.E.toFixed(2);
            }
            
            // 2. 拖动粒子（如果处于拖动状态）
            if (isDragging && selectedParticleId !== null) {
                const particle = getSelectedParticle();
                if (particle) {
                    // 修正粒子位置（减去偏移，确保粒子中心跟随鼠标）
                    let newX = originCoords.x - dragOffsetX;
                    let newY = originCoords.y - dragOffsetY;
                    
                    // 边界限制（防止粒子超出画布）
                    const maxX = width/2 - particleRadius;
                    const maxY = height/2 - particleRadius;
                    newX = Math.max(-maxX, Math.min(maxX, newX));
                    newY = Math.max(-maxY, Math.min(maxY, newY));
                    
                    particle.x = newX;
                    particle.y = newY;
                    
                    updateParticleControls(); // 同步更新滑块
                    needsRedraw = true;
                }
            }
        });
        
        // 鼠标抬起（结束拖动）
        canvas.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                canvas.style.cursor = 'crosshair'; // 恢复鼠标样式
            }
        });
        
        // 鼠标离开画布（结束拖动）
        canvas.addEventListener('mouseleave', () => {
            if (isDragging) {
                isDragging = false;
                canvas.style.cursor = 'crosshair';
            }
        });
        
        // -------------------------- 初始化 --------------------------
        selectParticle(1); // 初始选中第一个粒子
        render(); // 启动渲染
    </script>
</body>
</html>
